<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sem conexão</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #08121a;
        color: #e9f0f4;
        font-family: system-ui, sans-serif;
        padding: 24px;
        text-align: center;
      }
      h1 { font-size: 1.4rem; margin: 16px 0 8px; }
      p { color: #93a5b3; max-width: 32ch; margin: 0 auto 20px; }
      button {
        background: #34e0a1; color: #08121a; border: 0; border-radius: 6px;
        padding: 12px 20px; font-weight: 600; font-size: 1rem;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icone-192.png" width="72" height="72" alt="" style="border-radius: 16px" />
      <h1>Você está sem internet</h1>
      <p>Pra ver horários e agendar, precisamos de conexão. Confira o Wi-Fi ou os dados móveis.</p>
      <button onclick="location.reload()">Tentar de novo</button>
    </main>
  </body>
</html>
